name: Validate registry submissions
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'registry/**'
      - '.github/ISSUE_TEMPLATE/**'
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    name: Validate changed registry files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install YAML parser
        run: python -m pip install --upgrade pip PyYAML

      - name: Find changed files
        id: changed
        shell: bash
        run: |
          # Determine base ref for PRs; fall back to default branch for pushes
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.ref }}"
            echo "base_ref=$BASE" >> $GITHUB_OUTPUT
            git fetch origin "$BASE"
            CHANGED=$(git diff --name-only origin/"$BASE"...HEAD || git diff --name-only HEAD^..HEAD)
          else
            # on push to main/master, check files in the push
            CHANGED=$(git diff --name-only HEAD^..HEAD)
            echo "base_ref=${{ github.ref }}" >> $GITHUB_OUTPUT
          fi
          echo "files<<EOF" >> $GITHUB_OUTPUT
          printf "%s\n" "$CHANGED" | sed '/^$/d'
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Validate registry context frontmatter and files
        shell: bash
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          python - <<'PY'
          import os, sys, re, yaml
          from pathlib import Path

          files_text = os.environ.get('GITHUB_OUTPUT', None)
          # Instead, read changed files from the previous step output
          changed_files = []
          # GitHub provides changed.files via $GITHUB_STEP_SUMMARY is not reliable; use git to detect changed files
          try:
            # If this is a PR, git range origin/base...HEAD will already have been fetched
            base = os.environ.get('BASE_REF', '')
            # best-effort: list all changed files compared to origin/<base> if present
            if base:
              cmd = f"git diff --name-only origin/{base}...HEAD"
            else:
              cmd = "git diff --name-only HEAD^..HEAD"
            changed = os.popen(cmd).read().strip().splitlines()
            changed_files = [c for c in changed if c]
          except Exception:
            changed_files = []

          # If we couldn't detect changed files, fall back to scanning all registry/*/context.md
          if not changed_files:
            for p in Path('.').rglob('registry/*/context.md'):
              changed_files.append(str(p))

          problems = []
          for path in changed_files:
            if re.match(r'^registry/.+/context\.md$', path):
              p = Path(path)
              if not p.exists():
                problems.append(f"File {path} does not exist.")
                continue
              # Check extension
              if p.suffix.lower() != '.md':
                problems.append(f"{path}: file must have .md extension (not {p.suffix})")
              # Read raw bytes to detect BOM and ensure first bytes are ---
              raw = p.read_bytes()
              # UTF-8 BOM: 0xEF 0xBB 0xBF
              if raw.startswith(b'\xef\xbb\xbf'):
                problems.append(f"{path}: file contains a UTF-8 BOM; remove it so frontmatter starts at byte 0.")
                # Strip BOM for parsing to continue
                raw = raw[3:]
              text = raw.decode('utf-8', errors='replace')
              if not text.startswith('---'):
                problems.append(f"{path}: missing YAML frontmatter starting at the first line (must start with '---').")
                continue
              # find end of frontmatter
              try:
                # split only at first closing frontmatter --- (on its own line)
                m = re.split(r'\n---\s*\n', text, maxsplit=1)
                if len(m) < 2:
                  problems.append(f"{path}: frontmatter not closed with '---' on its own line.")
                  continue
                fm_text = m[0].lstrip('-\n')  # remove leading '---' if present
                # but better: find the block between the first '---' and the next '---'
                lines = text.splitlines()
                if lines[0].strip() != '---':
                  problems.append(f"{path}: frontmatter must start with a line containing only '---'.")
                  continue
                # locate second '---'
                try:
                  end_idx = lines[1:].index('---') + 1
                except ValueError:
                  problems.append(f"{path}: closing '---' for frontmatter not found.")
                  continue
                fm_block = '\n'.join(lines[1:end_idx])
                front = yaml.safe_load(fm_block)
                if not isinstance(front, dict):
                  problems.append(f"{path}: frontmatter parsed but is not a mapping (YAML object).")
                  continue
                # required keys
                for key in ('name','description'):
                  if key not in front or front[key] is None or str(front[key]).strip()=='':
                    problems.append(f"{path}: frontmatter missing required key '{key}' or it is empty.")
              except yaml.YAMLError as e:
                problems.append(f"{path}: YAML parse error: {e}")
              except Exception as e:
                problems.append(f"{path}: unexpected error during parse: {e}")

          if problems:
            print("VALIDATION FAILED. Problems detected:")
            for p in problems:
              print("- " + p)
            sys.exit(1)
          else:
            print("All changed registry context files passed validation.")
          PY

      - name: Success note
        if: success()
        run: echo "Validation passed. If you created a new registry entry, the PR can now be reviewed and merged."
