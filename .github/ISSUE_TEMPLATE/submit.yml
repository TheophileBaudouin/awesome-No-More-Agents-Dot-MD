name: Submit a context file
description: >-
  Share a Pi context file with the community registry. A bot validates it,
  opens a pull request for you, and a maintainer merges it after review.
title: "New context file: "
labels: ["submission"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing! Fill in the form below — every field the bot needs
        is required, so it can process your submission in one pass. No need to
        fork or clone.

        New to context files? Read the
        [contribution guide](CONTRIBUTING.md) and the
        [frontmatter schema](https://github.com/TheophileBaudouin/No-More-Agents-Dot-MD/blob/main/skill/context-engine/references/schema.md)
        first.

        NOTE: This template automatically applies the `submission` label when
        you create the issue, so you don't need to add any label yourself.
  - type: input
    id: name
    attributes:
      label: Directory name
      description: >-
        Lowercase kebab-case (letters, digits, single hyphens), e.g.
        `conventional-commits`. Must exactly match the `name` in your file's
        frontmatter.
      placeholder: my-context-rule
    validations:
      required: true
  - type: input
    id: description
    attributes:
      label: Short description
      description: >-
        One sentence telling someone what this file does. The bot adds it to
        your frontmatter as `description` if it is not there yet.
      placeholder: Enforce the Conventional Commits format.
    validations:
      required: true
  - type: input
    id: author
    attributes:
      label: Author (GitHub handle)
      description: >-
        Your GitHub username. The `@` is optional — the bot strips it if you
        include it.
      placeholder: octocat
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      description: Pick the best match. Used to filter the registry on the site.
      options:
        - workflow
        - security
        - ui
        - prompting
        - tooling
        - other
    validations:
      required: true
  - type: input
    id: tags
    attributes:
      label: Tags (comma-separated, optional)
      description: e.g. `git, commits, style`
      placeholder: git, commits
  - type: input
    id: repo
    attributes:
      label: Source repository (optional)
      description: >-
        URL where this context file lives. `https://` is added for you if you
        forget it.
      placeholder: https://github.com/octocat/my-dotfiles
  - type: input
    id: pi_version
    attributes:
      label: Minimum Pi version (optional)
      description: e.g. `0.1.0`
      placeholder: "0.1.0"
  - type: checkboxes
    id: agreement
    attributes:
      label: License agreement
      description: >-
        By publishing here your file is licensed under the MIT license, like
        the rest of the repository. You must agree to continue.
      options:
        - label: I agree to publish my context file under the MIT license.
          required: true
  - type: textarea
    id: content
    attributes:
      label: The context file
      description: >-
        The complete file, frontmatter included. It must start with `---` on
        the very first line. The bot fixes small mistakes for you (BOM,
        leading blank lines) and validates the frontmatter strictly: a file
        that would not load in the extension is rejected with an error that
        says exactly what to fix.
      placeholder: |
        ---
        name: my-context-rule
        events:
          - before_agent_start
        action:
          type: inject
          once: true
        ---
        Instructions for the agent…
      render: markdown
    validations:
      required: true
