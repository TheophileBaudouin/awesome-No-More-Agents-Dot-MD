name: Submit a context file
description: >-
  Share a Pi context file with the community registry — a bot validates it
  and opens a pull request for you.
title: "New context file: "
labels: ["submission"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing! Fill in the form below — no need to fork or clone.
        A bot will validate your submission and open a pull request that a
        maintainer will review and merge.

        New to context files? Read the
        [contribution guide](CONTRIBUTING.md) first.
  - type: input
    id: name
    attributes:
      label: Directory name
      description: >-
        Lowercase kebab-case, e.g. `conventional-commits`. Must exactly match
        the `name` in your file's frontmatter.
      placeholder: my-context-rule
    validations:
      required: true
  - type: input
    id: author
    attributes:
      label: Author (GitHub handle)
      description: Your GitHub username, without the `@`.
      placeholder: octocat
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      description: Pick the best match.
      options:
        - workflow
        - security
        - ui
        - prompting
        - tooling
        - other
    validations:
      required: true
  - type: input
    id: tags
    attributes:
      label: Tags (comma-separated, optional)
      description: e.g. `git, commits, style`
      placeholder: git, commits
  - type: input
    id: repo
    attributes:
      label: Source repository (optional)
      description: URL of the repository where this context file lives.
      placeholder: https://github.com/octocat/my-dotfiles
  - type: input
    id: pi_version
    attributes:
      label: Minimum Pi version (optional)
      description: e.g. `0.1.0`
      placeholder: "0.1.0"
  - type: textarea
    id: content
    attributes:
      label: The context file
      description: Paste your full context file here, frontmatter included.
      placeholder: |
        ---
        name: my-context-rule
        events:
          - before_agent_start
        action:
          type: inject
        ---
        Instructions for the agent…
      render: markdown
    validations:
      required: true
